name: screen-proxyip

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screen-proxyip
  cancel-in-progress: false

jobs:
  us:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      MIHOMO_VERSION: v1.19.32
      MIHOMO_SHA256: ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20
    steps:
      - uses: actions/checkout@v4

      - name: Install mihomo (pinned + checksum)
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum -c -
          gunzip mihomo.gz && chmod +x mihomo && ./mihomo -v

      - name: Install PyYAML
        run: pip install --no-cache-dir PyYAML==6.0.2

      - name: Screen US ProxyIPs
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          ENTRY_IP: ${{ vars.ENTRY_IP }}
          COUNTRY: US
          COLOS: SJC,LAX,SEA,PDX
          TOP_N: "6"
          OUT: proxyip/us.txt
        run: python3 screen.py

      - name: Commit list
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add proxyip/us.txt proxyip/us.json
          if git diff --cached --quiet; then echo "no change"; else git commit -m "proxyip/us: $(cat proxyip/us.txt)" && git push; fi

      - name: Publish TXT record
        if: ${{ vars.CF_RECORD != '' }}
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE: ${{ vars.CF_ZONE }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          RECORD: ${{ vars.CF_RECORD }}
          FILE: proxyip/us.txt
        run: python3 update_dns.py
