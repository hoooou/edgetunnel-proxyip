name: screen-proxyip

on:
  schedule:
    - cron: "0 3,9,15,21 * * *"   # every 6h: 05/11/17/23 Asia/Shanghai
  workflow_dispatch:
  push:
    branches: [main]
    paths: [screen.py, residential.py, update_dns.py, .github/workflows/screen.yml]

permissions:
  contents: write

concurrency:
  group: screen-proxyip
  cancel-in-progress: false

jobs:
  # One runner per list, all three at the same time: separate runners do not share a network
  # path, so their measurements do not interfere with each other.
  screen:
    name: screen-${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          # Disabled while the Worker is placed in Tokyo: measured from Tokyo, every US proxy sits
          # on a trans-Pacific hop (17-19 Mbps down, 3 Mbps up regardless of quality), so a fresh
          # US list would be noise. The published us.proxyip record keeps its last good value.
          # Move Placement back to US-West, then uncomment this entry and restore the floors.
          # - name: us
          #   script: screen.py
          #   out: us.txt
          #   env: "COUNTRY=US COLOS=SJC,LAX,SEA,PDX TOP_N=6"
          - name: apac
            script: screen.py
            out: apac.txt
            # Worker is placed in Tokyo, so Tokyo/Singapore proxies are measured on a local hop:
            # the normal floor (upload >= 5 Mbps) applies again.
            env: "COUNTRY=JP,SG COLOS=NRT,KIX,SIN TOP_N=8 PER_COUNTRY=JP:4,SG:4 STAGE2=60 SITE_POOL=30"
          - name: res
            script: residential.py
            out: res.txt
            env: "RES_BW_CONC=2"
    env:
      MIHOMO_VERSION: v1.19.32
      MIHOMO_SHA256: ba3ce607747a07f948fc35780e108a4a7c7f552a38b9bd4d115f313ebcb89c20
    steps:
      - uses: actions/checkout@v4

      - name: Install mihomo (pinned + checksum)
        run: |
          curl -fsSL -o mihomo.gz "https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/mihomo-linux-amd64-compatible-${MIHOMO_VERSION}.gz"
          echo "${MIHOMO_SHA256}  mihomo.gz" | sha256sum -c -
          gunzip mihomo.gz && chmod +x mihomo && ./mihomo -v

      - name: Install PyYAML
        run: pip install --no-cache-dir PyYAML==6.0.2

      - name: Screen ${{ matrix.name }}
        env:
          SUB_URL: ${{ secrets.SUB_URL }}
          ENTRY_IP: ${{ vars.ENTRY_IP }}
          IPAPI_IS_KEY: ${{ secrets.IPAPI_IS_KEY }}
          PROFILE: ${{ matrix.env }}
        run: |
          for kv in $PROFILE; do export "$kv"; done
          if [ "${{ matrix.name }}" = "res" ]; then export RES_OUT=proxyip/res.txt
          else export OUT=proxyip/${{ matrix.out }}; fi
          python3 ${{ matrix.script }}

      - name: Mark success
        if: success()
        run: touch "proxyip/${{ matrix.out }}.ok"

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-${{ matrix.name }}
          # each runner only has the files it produced; wildcards keep this readable
          path: |
            proxyip/*.txt
            proxyip/*.ok
            proxyip/*.json
            proxyip/node.enc
          if-no-files-found: warn
          retention-days: 3

  # Single writer: collects every runner's artefacts, commits once, and updates one TXT record
  # per list that actually produced a fresh list this run.
  publish:
    needs: screen
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install PyYAML
        run: pip install --no-cache-dir PyYAML==6.0.2

      - name: Collect results
        uses: actions/download-artifact@v4
        with:
          pattern: result-*
          merge-multiple: true
          path: /tmp/results

      - run: ls -la /tmp/results

      # Two runs can overlap (schedule + push), and rebasing a binary-ish generated file is how
      # you get a conflict. Instead: always start from the remote tip, copy the fresh results on
      # top, commit, push; retry the whole cycle if someone else got there first.
      - name: Commit lists and lookup cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4; do
            git fetch -q origin main
            git reset -q --hard origin/main
            cp -r /tmp/results/. proxyip/
            git add proxyip/*.txt proxyip/*.json proxyip/node.enc 2>/dev/null || true
            if git diff --cached --quiet; then echo "no change"; exit 0; fi
            git commit -q -m "proxyip: refresh lists"
            if git push -q; then echo "pushed"; exit 0; fi
            echo "push raced, retry $attempt"; sleep 5
          done
          exit 1

      - name: Publish TXT records
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE: ${{ vars.CF_ZONE }}
          CF_ZONE_ID: ${{ vars.CF_ZONE_ID }}
          REC_US: ${{ vars.CF_RECORD }}
          REC_APAC: ${{ vars.CF_RECORD_APAC }}
          REC_RES: ${{ vars.CF_RECORD_RES }}
        run: |
          publish () {   # <record> <file>
            rec="$1"; file="$2"
            if [ -z "$rec" ] || [ ! -f "$file" ] || [ ! -f "$file.ok" ]; then
              echo "skip ${rec:-<unset>} (no fresh list this run)"; return 0
            fi
            RECORD="$rec" FILE="$file" python3 update_dns.py
          }
          publish "$REC_US" proxyip/us.txt
          publish "$REC_APAC" proxyip/apac.txt
          publish "$REC_RES" proxyip/res.txt
